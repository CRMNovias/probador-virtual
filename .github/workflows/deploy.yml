name: Deploy

# Igual que la V1: cada push a main entra por SSH al servidor del probador,
# actualiza el código, compila y recarga la app en PM2. Preparación única del
# servidor (nginx, .env.local, ffmpeg): docs/deploy.md.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 144.76.145.228
          username: root
          port: 5555
          key: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /home/probador/probador-v2
            git pull origin main
            npm ci
            npm run build
            pm2 startOrReload ecosystem.config.cjs --update-env
            pm2 save
