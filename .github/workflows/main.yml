name: Deploy

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 144.76.145.228
          username: root
          port: 5555
          key: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/probador/probador-virtual
            git pull origin main
            npm install
            npm run build
            # Sedka y Outlet: esta misma V2 en la raíz de su probador, en cuanto su V1
            # está en /v1 (repos ARS-BRIDAL/probador-virtual-sedka y -outlet). La
            # carpeta de Outlet en el servidor se llama así, «oulet».
            SEDKA=/home/probador/probador-sedka.crmnovias.com/public_html/dist
            if [ -d "$SEDKA/v1" ]; then sh scripts/marca-v2.sh sedka dist "$SEDKA"; fi
            OUTLET=/home/probador/probador-oulet.crmnovias.com/public_html/dist
            if [ -d "$OUTLET/v1" ]; then sh scripts/marca-v2.sh outlet dist "$OUTLET"; fi
